<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حلواني أبو عمر | المنيو</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap');
*{box-sizing:border-box}
:root{--red:#7f1d1d;--red2:#a52b22;--gold:#c9a35b;--cream:#fbf7ef;--ink:#291914;--muted:#756b64;--card:#fffdf9}
body{margin:0;font-family:'Cairo','Tajawal',Tahoma,sans-serif;background:linear-gradient(180deg,#fffaf2 0,#f8f1e5 100%);color:var(--ink)}
button,input,textarea,select{font-family:inherit}
header{background:linear-gradient(135deg,#671615,#921f1b 55%,#641512);color:#fff;padding:22px 16px 20px;text-align:center;position:sticky;top:0;z-index:20;box-shadow:0 5px 22px #3b170c33;border-bottom:2px solid var(--gold)}
.logo{width:86px;height:86px;border-radius:50%;object-fit:contain;background:#fff;padding:6px;margin:auto;display:block;box-shadow:0 4px 15px #0003}
h1{margin:8px 0 0;font-size:29px;font-weight:800;letter-spacing:-.5px}.sub{font-size:13px;opacity:.9;margin-top:2px}
.wrap{max-width:1180px;margin:auto;padding:20px 16px 55px}
.search{width:100%;padding:15px 19px;border:1px solid #e7dccb;border-radius:16px;font-size:16px;margin-bottom:14px;background:#fff;box-shadow:0 5px 18px #5c2b1510;outline:none}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c9a35b22}
.tabs{display:flex;gap:9px;overflow:auto;padding:4px 2px 12px;position:sticky;top:133px;background:#faf5ec;z-index:10}
.tabs button{border:1px solid #eadfce;background:#fff;color:#5b4031;padding:10px 17px;border-radius:30px;white-space:nowrap;box-shadow:0 2px 9px #0000000b;cursor:pointer;font-weight:600;transition:.2s}
.tabs button:hover{transform:translateY(-1px)}
.tabs button.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 5px 14px #7f1d1d33}
.section-title{display:flex;align-items:center;gap:12px;margin:26px 0 14px}.section-title h2{margin:0;font-size:22px;font-weight:800}.line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 6px 20px #4d28140e;border:1px solid #eadfce;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px #4d28141c}
.pic{height:190px;background:linear-gradient(135deg,#f4ecdf,#fff);display:flex;align-items:center;justify-content:center;color:#b59c82;font-size:52px}.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:14px 15px 16px}.name{font-weight:800;font-size:17px}.desc{font-size:12px;color:var(--muted);margin:5px 0;min-height:18px}.price{color:var(--red);font-weight:800;font-size:18px}
footer{text-align:center;padding:28px;color:#806f62;font-size:13px}
#admin{display:none;background:#fffdf9;border:1px solid #e5d7c4;border-top:4px solid var(--gold);padding:22px;margin-top:30px;border-radius:22px;box-shadow:0 10px 30px #4d281411}
#admin h2{margin-top:0;font-size:22px}.adminrow{display:grid;grid-template-columns:1fr 1fr;gap:11px}.adminrow input,.adminrow select,.adminrow textarea{width:100%;padding:12px 13px;border:1px solid #dfd2c2;border-radius:12px;background:#fff;font-size:14px;outline:none}.adminrow input:focus,.adminrow textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c9a35b22}.adminrow textarea{min-height:86px}.btn{border:0;border-radius:11px;padding:10px 15px;cursor:pointer;font-weight:700}.primary{background:var(--red);color:#fff}.gold{background:#d6b16a;color:#291914}.danger{background:#a92323;color:#fff}.small{font-size:12px;color:#7b6e65}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#adminList>div{padding:11px 0;border-bottom:1px solid #eee2d4}
@media(max-width:600px){h1{font-size:24px}.wrap{padding:14px 11px 45px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic{height:135px}.name{font-size:14px}.desc{font-size:11px}.price{font-size:15px}.info{padding:11px}.tabs{top:126px}.adminrow{grid-template-columns:1fr}#admin{padding:16px}}

.contact-bar{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin:12px auto 0;font-size:13px}
.contact-bar a{color:#fff;text-decoration:none;background:#fff2;border:1px solid #ffffff55;padding:6px 13px;border-radius:20px;font-weight:800}
.contact-bar a:hover{background:#fff3}
.logo{object-fit:contain!important}
@media(max-width:600px){.contact-bar{gap:7px;font-size:11px}.contact-bar a{padding:5px 9px}}

.menu-word{display:inline-block;margin-top:2px;font-size:14px;font-weight:700;letter-spacing:1.5px;color:#f4dca6;text-transform:uppercase}
.admin-open{margin-top:12px;border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:22px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}.admin-open:hover{background:#fff2}@media(max-width:600px){.admin-open{display:inline-block;font-size:12px;padding:7px 13px}}
</style>
</head>
<body>
<header>
  <img id="logo" class="logo" src="logo.jpg" alt="شعار حلواني أبو عمر">
  <h1 id="brand">حلواني أبو عمر</h1>
  <div class="sub">Borg Al Arab<br><span class="menu-word">Menu</span></div>
  <button id="adminBtn" class="admin-open" onclick="openAdmin()">⚙️ إدارة المنيو</button>
</header>

<main class="wrap">
  <input id="search" class="search" placeholder="ابحث عن صنف..." oninput="render()">
  <div id="tabs" class="tabs"></div>
  <div id="menu"></div>

  <section id="admin">
    <h2>⚙️ تعديل المنيو</h2>
    <p class="small">التعديلات تُحفظ على نفس المتصفح. لتعديل المنيو على جهاز آخر، استخدم تصدير/استيراد البيانات.</p>
    <div class="adminrow">
      <input id="aName" placeholder="اسم الصنف">
      <input id="aPrice" placeholder="السعر">
      <input id="aCat" placeholder="القسم">
      <input id="aImg" placeholder="رابط صورة (اختياري)">
      <textarea id="aDesc" placeholder="وصف مختصر (اختياري)"></textarea>
      <input id="aIndex" type="number" min="0" placeholder="رقم المنتج للتعديل (اتركه فارغًا للإضافة)">
    </div>
    <div class="admin-actions">
      <button class="btn primary" onclick="saveItem()">حفظ الصنف</button>
      <button class="btn gold" onclick="exportData()">تصدير المنيو</button>
      <label class="btn gold">استيراد المنيو<input type="file" accept=".json" hidden onchange="importData(event)"></label>
      <button class="btn danger" onclick="resetData()">إرجاع البيانات التجريبية</button>
    </div>
    <hr>
    <div id="adminList"></div>
  </section>
</main>
<footer>حلواني أبو عمر – فروع برج العرب<br><a href="tel:01016111412" style="color:#7f1d1d;font-weight:800;text-decoration:none">للطلبات والدليفري: 01016111412</a></footer>

<script>
const demo=[
{name:"كيلو مشكل",price:"180 جنيه",cat:"حلاوة المولد",desc:"تشكيلة مشكلة من أصناف حلاوة المولد",img:""},
{name:"كيلو علف",price:"185 جنيه",cat:"حلاوة المولد",desc:"",img:""},
{name:"كيلو ملابن",price:"175 جنيه",cat:"حلاوة المولد",desc:"",img:""},
{name:"علبة لارج 450 جم",price:"85 جنيه",cat:"حلاوة المولد",desc:"",img:""},
{name:"علبة إكس لارج 900 جم",price:"165 جنيه",cat:"حلاوة المولد",desc:"",img:""},
{name:"تورتة",price:"حسب الاختيار",cat:"تورت وحفلات",desc:"اختيارات متعددة حسب المقاس والتصميم",img:""},
{name:"جاتوه",price:"حسب الاختيار",cat:"حلويات غربية",desc:"",img:""},
{name:"حلويات شرقية",price:"حسب الاختيار",cat:"حلويات شرقية",desc:"",img:""},
{name:"مخبوزات",price:"حسب الاختيار",cat:"مخبوزات",desc:"",img:""}
];
let items=JSON.parse(localStorage.getItem("aboOmarMenu")||"null")||demo;
let active="الكل";
function cats(){return ["الكل",...new Set(items.map(x=>x.cat))]}
function renderTabs(){
 const t=document.getElementById("tabs");t.innerHTML="";
 cats().forEach(c=>{let b=document.createElement("button");b.textContent=c;b.className=c===active?"active":"";b.onclick=()=>{active=c;render()};t.appendChild(b)})
}
function render(){
 renderTabs();
 const q=document.getElementById("search").value.trim().toLowerCase();
 const filtered=items.filter(x=>(active==="الكل"||x.cat===active)&&((x.name+" "+x.desc).toLowerCase().includes(q)));
 const groups={};filtered.forEach((x,i)=>(groups[x.cat]??=[]).push({...x,_i:items.indexOf(x)}));
 const menu=document.getElementById("menu");menu.innerHTML="";
 Object.entries(groups).forEach(([cat,arr])=>{
   let s=document.createElement("section");s.innerHTML=`<div class="section-title"><h2>${cat}</h2><div class="line"></div></div>`;
   let g=document.createElement("div");g.className="grid";
   arr.forEach(x=>{let c=document.createElement("article");c.className="card";
     c.innerHTML=`<div class="pic">${x.img?`<img src="${esc(x.img)}" alt="${esc(x.name)}">`:"🍰"}</div><div class="info"><div class="name">${esc(x.name)}</div><div class="desc">${esc(x.desc||"")}</div><div class="price">${esc(x.price)}</div></div>`;
     g.appendChild(c)
   });s.appendChild(g);menu.appendChild(s)
 });
 renderAdmin();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function save(){localStorage.setItem("aboOmarMenu",JSON.stringify(items))}
function saveItem(){
 let name=aName.value.trim();if(!name)return alert("اكتب اسم الصنف");
 let obj={name,price:aPrice.value.trim()||"حسب الاختيار",cat:aCat.value.trim()||"أصناف أخرى",desc:aDesc.value.trim(),img:aImg.value.trim()};
 let idx=aIndex.value.trim();
 if(idx==="") items.push(obj); else if(items[+idx]) items[+idx]=obj; else return alert("رقم المنتج غير صحيح");
 save();[aName,aPrice,aCat,aDesc,aImg,aIndex].forEach(x=>x.value="");render();alert("تم الحفظ");
}
function renderAdmin(){
 const box=document.getElementById("adminList");box.innerHTML=items.map((x,i)=>`<div style="padding:9px 0;border-bottom:1px solid #eee"><b>${i} - ${esc(x.name)}</b> — ${esc(x.price)} <button class="btn gold" onclick="editItem(${i})">تعديل</button> <button class="btn danger" onclick="delItem(${i})">حذف</button></div>`).join("");
}
function editItem(i){let x=items[i];aName.value=x.name;aPrice.value=x.price;aCat.value=x.cat;aDesc.value=x.desc;aImg.value=x.img;aIndex.value=i;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function delItem(i){if(confirm("حذف الصنف؟")){items.splice(i,1);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="abo-omar-menu.json";a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{items=JSON.parse(r.result);save();render();alert("تم الاستيراد")}catch{alert("ملف غير صالح")}};r.readAsText(f)}
function resetData(){if(confirm("إرجاع البيانات التجريبية؟")){items=demo;save();render()}}
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="a"){let p=prompt("كلمة مرور التعديل");if(p==="2307"){document.getElementById("admin").style.display="block";alert("تم فتح لوحة التعديل")}else alert("كلمة المرور غير صحيحة")}})
function openAdmin(){
  let p=prompt("اكتب كلمة مرور إدارة المنيو");
  if(p==="2307"){
    document.getElementById("admin").style.display="block";
    document.getElementById("adminBtn").textContent="⚙️ لوحة التعديل مفتوحة";
    document.getElementById("admin").scrollIntoView({behavior:"smooth",block:"start"});
  }else if(p!==null) alert("كلمة المرور غير صحيحة");
}
render();
</script>
</body>
</html>
